name = "njy-app"
compatibility_date = "2026-08-01"
pages_build_output_dir = "public"

# D1 database — PRODUCTION account's DB `njy`.
# This file is what makes the `prod` branch different from `main`.
# When merging `main` into `prod` for a release, keep these lines as-is.
[[d1_databases]]
binding = "DB"
database_name = "njy"
database_id = "69ba5e0d-b77b-4227-9c48-18f0f4166b50"
migrations_dir = "schema"

# Session secret and VAPID keys are set via `wrangler pages secret put`.
# Do not put secrets in this file.

[vars]
APP_TZ = "Asia/Kolkata"
OVERDUE_DAYS = "7"
