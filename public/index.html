<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NJY — ISKCON Thiruppalai</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#0E4F52">
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<section id="view-login" class="center" hidden>
  <div class="card">
    <div class="login-topline">
      <h2 id="login-title">Nama-Japa-Yajna</h2>
      <a href="#" id="login-lang-toggle" class="login-lang" title="Switch language"></a>
    </div>
    <form id="login-form" autocomplete="on" method="post" action="javascript:void(0)">
      <label for="u" id="login-u-label">Username</label>
      <input id="u" name="username" required autocapitalize="none" autocorrect="off">
      <label for="p" id="login-p-label">Password</label>
      <div class="eye-wrap">
        <input id="p" name="password" type="password" required>
        <button type="button" class="eye-btn" id="login-eye" aria-label="Show / hide password">👁</button>
      </div>
      <p class="error" id="login-err" hidden></p>
      <p style="margin-top:1.2rem"><button class="primary" type="submit" id="login-btn">Sign In</button></p>
    </form>
    <p class="hint" id="login-hint">Dear Devotee, to participate in this glorious service, please contact your Service Line Authority.</p>
  </div>
</section>

<main id="view-app" class="app" hidden>
  <header class="topbar">
    <h1><a href="#/" style="color:inherit;text-decoration:none">NJY</a></h1>
    <div class="who">
      <div class="who-line">
        <strong id="who-name"></strong>
        <span id="who-role"></span>
        <a href="#" id="logout">Sign out</a>
        <!-- Language quick-toggle -->
        <a href="#" id="lang-toggle" style="margin-left:.4rem;font-size:.75rem;color:var(--muted)" title="Switch language"></a>
      </div>
      <a href="#/profile" id="pts-chip" class="pts-chip" hidden></a>
    </div>
  </header>
  <nav class="nav" id="nav"></nav>
  <section id="view" aria-live="polite"></section>
</main>
<aside id="lb-side" class="lb-side" hidden aria-label="Live leaderboard"></aside>
<footer id="lb-strip" class="lb-strip" hidden aria-label="Live leaderboard (mobile)"></footer>

<script src="/assets/i18n.js"></script>
<script src="/assets/app.js" type="module"></script>
</body>
</html>
